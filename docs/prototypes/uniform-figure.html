<!doctype html>
<meta charset="utf-8" />
<title>figure dev</title>
<style>
  body {
    background: #0a0a0a;
    margin: 0;
    padding: 40px;
    font-family: monospace;
    color: #888;
  }
  .row {
    display: flex;
    gap: 44px;
    align-items: flex-end;
    flex-wrap: wrap;
    margin-bottom: 48px;
  }
  .cell {
    text-align: center;
  }
  .cell .l {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-top: 12px;
    color: #777;
  }
  svg {
    display: block;
  }
</style>
<body>
  <div class="row" id="row-classic"></div>
  <div class="row" id="row-modern"></div>
  <div class="row" id="row-mix"></div>
  <div id="anat"></div>
  <script>
    'use strict';
    /* ============ shared figure geometry, layered parts, colorway channels ============
       Architecture: albedo garment parts (colorway-driven fills, incl. procedural
       print fills) + shared colorway-independent shading overlays + procedural
       finish effects. Symmetric limbs author once, mirror for the right side;
       per-side configs (armL/armR, legL/legR) unlock modern asymmetry. */

    // ---------- low-level helpers ----------
    function P(d, fill, extra = '') {
      return `<path d="${d}" fill="${fill}" ${extra}/>`;
    }
    function shade(d, o) {
      return `<path d="${d}" fill="#000" opacity="${o}"/>`;
    }
    function light(d, o) {
      return `<path d="${d}" fill="#fff" opacity="${o}"/>`;
    }
    function stroke(d, col, w, extra = '') {
      return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
    }
    function mirror(inner) {
      return `<g transform="translate(240,0) scale(-1,1)">${inner}</g>`;
    }
    function sequins(cx, cy, w, h, seed, n, col = '#fff') {
      let s = seed,
        out = '';
      const rnd = () => {
        s = (s * 9301 + 49297) % 233280;
        return s / 233280;
      };
      for (let i = 0; i < n; i++) {
        const x = cx - w / 2 + rnd() * w,
          y = cy - h / 2 + rnd() * h;
        const r = 0.5 + rnd() * 0.9,
          o = 0.25 + rnd() * 0.55;
        out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${col}" opacity="${o.toFixed(2)}"/>`;
      }
      return out;
    }
    function darken(hex, f) {
      const n = parseInt(hex.slice(1), 16);
      const r = Math.round(((n >> 16) & 255) * (1 - f)),
        g = Math.round(((n >> 8) & 255) * (1 - f)),
        b = Math.round((n & 255) * (1 - f));
      return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
    }
    function lighten(hex, f) {
      const n = parseInt(hex.slice(1), 16);
      const r = Math.round(((n >> 16) & 255) + (255 - ((n >> 16) & 255)) * f),
        g = Math.round(((n >> 8) & 255) + (255 - ((n >> 8) & 255)) * f),
        b = Math.round((n & 255) + (255 - (n & 255)) * f);
      return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
    }

    // ---------- shared geometry (paths reused across parts) ----------
    const TORSO_D =
      'M78,104 Q120,93 162,104 L158,150 Q153,200 153,248 L155,260 Q120,269 85,260 L87,248 Q87,200 82,150 Z';
    const TUNIC_D =
      'M78,104 Q120,93 162,104 L158,150 Q154,196 154,224 L151,270 Q143,292 131,296 L121,266 Q102,262 88,254 L87,246 Q87,198 82,150 Z';
    const LEG_D =
      'M90,254 L85,308 Q83,360 91,438 L114,438 Q112,384 113,336 Q113,306 116,284 Q119,276 120,272 L120,254 Z';
    const LEG_FLARE_D =
      'M90,254 L85,308 Q83,360 83,406 Q81,428 75,446 L118,446 Q114,390 114,336 Q113,306 116,284 Q119,276 120,272 L120,254 Z';
    const LEG_TATTER_D =
      'M90,254 L85,308 Q83,360 88,422 L87,442 L92,427 L96,444 L101,428 L105,443 L109,427 L112,441 L114,422 Q113,380 113,336 Q113,306 116,284 Q119,276 120,272 L120,254 Z';
    const SLEEVE_D =
      'M78,103 Q66,111 62,134 Q57,165 59,197 Q60,223 63,242 L82,244 Q79,214 79,186 Q79,148 88,118 Q85,107 78,103 Z';
    const BARE_ARM_D =
      'M80,110 Q68,120 63,142 Q58,168 60,198 Q61,224 64,242 L82,244 Q80,214 80,188 Q80,152 86,122 Q85,114 80,110 Z';

    // ---------- procedural print + gradient defs (per-figure, uid-scoped) ----------
    function defs(cw, uid) {
      let d = '';
      d += `<clipPath id="${uid}-tclip"><path d="${cw.torsoStyle === 'tunic' ? TUNIC_D : TORSO_D}"/></clipPath>`;
      if (cw.print === 'sunburst') {
        d += `<radialGradient id="${uid}-sun" gradientUnits="userSpaceOnUse" cx="98" cy="252" r="220">
          <stop offset="0" stop-color="#f7dd7a"/><stop offset=".18" stop-color="#e8952f"/>
          <stop offset=".42" stop-color="#c23a2a"/><stop offset=".7" stop-color="#6d1f3f"/>
          <stop offset="1" stop-color="#241021"/></radialGradient>`;
      }
      if (cw.print === 'opart') {
        d += `<pattern id="${uid}-opart" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
          <rect width="14" height="14" fill="#e08a12"/>
          <circle cx="3.5" cy="3.5" r="2.6" fill="#f7cf3e"/>
          <circle cx="10.5" cy="10.5" r="2.6" fill="#8a3a12"/>
          <path d="M-2,10 Q3.5,6 7,10 T16,10" stroke="#f9e8a0" stroke-width="1" fill="none" opacity=".55"/>
        </pattern>`;
      }
      if (cw.grads) {
        for (const [id, stops] of Object.entries(cw.grads)) {
          d += `<linearGradient id="${uid}-${id}" gradientUnits="userSpaceOnUse" x1="0" y1="104" x2="0" y2="250">`;
          for (const [off, col] of stops) d += `<stop offset="${off}" stop-color="${col}"/>`;
          d += `</linearGradient>`;
        }
      }
      if (cw.glow) {
        d += `<filter id="${uid}-glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>`;
      }
      if (cw.print === 'pinstripe') {
        d += `<pattern id="${uid}-pinstripe" width="7" height="7" patternUnits="userSpaceOnUse">
          <rect width="7" height="7" fill="#efe3c8"/>
          <path d="M3.5,0 V7" stroke="#d3bd90" stroke-width="1.1"/>
        </pattern>`;
      }
      if (cw.plaid) {
        d += `<pattern id="${uid}-plaid" width="13" height="13" patternUnits="userSpaceOnUse">
          <rect width="13" height="13" fill="#d0951c"/>
          <path d="M0,4.5 H13" stroke="#b57712" stroke-width="3"/>
          <path d="M4.5,0 V13" stroke="#e8c25a" stroke-width="2.2" opacity=".85"/>
          <path d="M0,10.5 H13" stroke="#8f5f10" stroke-width="1.2"/>
        </pattern>`;
      }
      if (cw.foilLeg) {
        d += `<linearGradient id="${uid}-foil" gradientUnits="userSpaceOnUse" x1="80" y1="260" x2="130" y2="440">
          <stop offset="0" stop-color="#b98c2e"/><stop offset=".35" stop-color="#f2df9a"/>
          <stop offset=".6" stop-color="#caa03c"/><stop offset="1" stop-color="#8f6d20"/></linearGradient>`;
      }
      return `<defs>${d}</defs>`;
    }
    function fillOf(spec, cw, uid) {
      if (!spec) return null;
      if (spec.startsWith('url:')) return `url(#${uid}-${spec.slice(4)})`;
      return spec;
    }

    // ---------- body parts ----------
    function ground() {
      return `<ellipse cx="120" cy="466" rx="54" ry="8" fill="#000" opacity="0.4"/>`;
    }

    function headNeck(cw) {
      const s = cw.skin;
      let g = '';
      g += P('M110,74 L110,96 Q120,103 130,96 L130,74 Z', s);
      g += shade('M110,76 Q120,86 130,76 L130,74 L110,74 Z', 0.22);
      g += P(
        'M103,46 Q103,26 120,26 Q137,26 137,46 Q137,62 130,72 Q125,78 120,78 Q115,78 110,72 Q103,62 103,46 Z',
        s
      );
      g += P('M101,50 Q97,52 99,58 Q101,62 104,60 Z', s);
      g += P('M139,50 Q143,52 141,58 Q139,62 136,60 Z', s);
      g += shade('M128,29 Q136,38 135,52 Q134,64 128,71 Q132,58 131,44 Q130,34 128,29 Z', 0.12);
      g += light('M107,40 Q106,52 111,62 Q107,50 109,40 Z', 0.1);
      return g;
    }

    function hair(cw) {
      const c = cw.hair || '#2b2119';
      return (
        P(
          'M103,44 Q102,26 120,25 Q138,26 137,44 Q136,38 132,34 Q126,30 120,30 Q114,30 108,34 Q104,38 103,44 Z',
          c
        ) + shade('M124,27 Q134,30 136,42 Q133,33 124,29 Z', 0.25)
      );
    }

    function legSide(l, cw, uid) {
      const fill = fillOf(l.fill, cw, uid) || l.color;
      const d = l.flare ? LEG_FLARE_D : l.tattered ? LEG_TATTER_D : LEG_D;
      let g = P(d, fill);
      // inseam shadow + crease highlight (shared)
      g += shade('M113,300 Q112,370 113,436 L108,436 Q108,370 110,300 Z', 0.12);
      g += light('M100,290 Q98,360 100,432 L103,432 Q101,360 103,290 Z', 0.07);
      if (l.stripe)
        g += P('M90,258 L86,308 Q84,360 92,436 L98,436 Q90,360 92,308 L96,258 Z', l.stripe);
      if (l.foil) {
        g += sequins(100, 350, 26, 170, 17, 40);
        g += light('M96,270 Q93,350 97,430 L101,430 Q97,350 100,272 Z', 0.18);
      }
      if (l.sequin) g += sequins(100, 350, 24, 170, 19, 34);
      return g;
    }
    function legs(cw, uid) {
      let g = legSide(cw.legL, cw, uid) + mirror(legSide(cw.legR, cw, uid));
      g += shade('M115,270 Q120,264 125,270 Q122,284 120,296 Q118,284 115,270 Z', 0.12);
      g += shade(
        'M88,254 L152,254 L151,268 Q120,274 89,268 Z',
        cw.torsoStyle === 'jumpsuit' ? 0.08 : 0.2
      );
      return g;
    }

    function streamers(cw) {
      if (!cw.streamers) return '';
      const [c1, c2] = cw.streamers;
      const side =
        P('M88,258 Q70,330 66,400 Q64,428 68,446 L78,444 Q74,420 78,380 Q82,320 96,262 Z', c1) +
        P(
          'M92,262 Q80,330 78,398 Q77,420 80,440 L87,438 Q84,410 88,368 Q92,314 101,264 Z',
          c2,
          `opacity=".8"`
        ) +
        light('M88,262 Q76,330 72,400 L75,400 Q78,330 92,264 Z', 0.16);
      return side + mirror(side);
    }

    function shoes(cw) {
      let g = '';
      if (cw.sneaker) {
        const body = 'M89,432 Q86,446 90,450 L115,450 Q117,443 114,432 Z';
        const sole = 'M87,448 L117,448 Q118,454 115,456 L89,456 Q86,453 87,448 Z';
        const one =
          P(body, '#f4f4f2') +
          P(sole, '#d8d8d3') +
          shade('M89,446 L115,446 L115,449 L89,449 Z', 0.12) +
          stroke('M93,436 L100,433 M96,440 L104,436', '#b9b9b4', 1.4);
        g += one + mirror(one);
        return g;
      }
      const c = cw.shoe;
      const shoe = 'M89,436 Q85,452 91,457 L114,457 Q117,450 114,436 Z';
      g += P(shoe, c);
      g += mirror(P(shoe, c));
      g += shade('M89,452 Q100,457 114,455 L114,457 L91,457 Q87,455 89,452 Z', 0.4);
      g += mirror(shade('M89,452 Q100,457 114,455 L114,457 L91,457 Q87,455 89,452 Z', 0.4));
      g += light('M92,438 L112,438 L112,441 L92,441 Z', 0.1);
      if (cw.spats) {
        const sp = 'M91,436 Q88,448 93,452 L112,452 Q114,446 112,436 Z';
        g += P(sp, '#f2efe6') + mirror(P(sp, '#f2efe6'));
        g += `<circle cx="96" cy="443" r="1.2" fill="#999"/><circle cx="96" cy="448" r="1.2" fill="#999"/>`;
        g += mirror(
          `<circle cx="96" cy="443" r="1.2" fill="#999"/><circle cx="96" cy="448" r="1.2" fill="#999"/>`
        );
      }
      return g;
    }

    function torso(cw, uid) {
      const d = cw.torsoStyle === 'tunic' ? TUNIC_D : TORSO_D;
      const fill = fillOf(cw.torsoFill, cw, uid) || cw.jacket;
      let g = P(d, fill);
      if (cw.print === 'sunburst') {
        // radial rays from the hip focus, clipped to the tunic
        let rays = '';
        const ends = [
          [210, 120],
          [200, 80],
          [180, 50],
          [156, 30],
          [130, 22],
          [104, 26],
          [86, 44],
          [78, 70],
        ];
        for (const [x, y] of ends)
          rays += stroke(`M98,252 L${x},${y}`, '#f7dd7a', 2.4, `opacity=".3"`);
        g += `<g clip-path="url(#${uid}-tclip)">${rays}</g>`;
      }
      g += shade(
        'M140,99 Q149,180 148,260 L155,260 L153,248 Q153,175 158,116 L162,104 Q152,100 140,99 Z',
        0.16
      );
      g += light('M87,107 Q85,170 90,250 L95,252 Q90,176 95,111 Z', 0.09);
      g += shade('M104,96 Q120,106 136,96 Q120,112 104,96 Z', 0.18);
      if (cw.torsoSequin)
        g += `<g clip-path="url(#${uid}-tclip)">${sequins(120, 170, 80, 130, 23, 90)}</g>`;
      if (cw.patent) {
        g += light('M94,112 Q92,170 95,242 L103,244 Q99,175 102,116 Z', 0.22);
        g += light('M132,108 Q136,160 134,230 L138,230 Q140,160 136,110 Z', 0.1);
      }
      if (cw.zipper) {
        g += stroke('M120,102 L120,244', '#c9ced6', 1.6);
        g += `<circle cx="120" cy="110" r="2.2" fill="#c9ced6"/>`;
      }
      return g;
    }

    function suspenders(cw) {
      if (!cw.suspenders) return '';
      const c = cw.suspenders;
      const strap =
        P('M100,105 Q96,170 98,248 L107,248 Q104,170 107,107 Z', c) +
        shade('M104,110 Q102,175 105,246 L107,248 L104,248 Q101,175 102,110 Z', 0.2) +
        `<rect x="98.5" y="238" width="8" height="6" rx="1" fill="#b9893a"/>`;
      return strap + mirror(strap);
    }

    function tieDrop(cw) {
      if (!cw.tie) return '';
      let g = P('M113,100 L127,100 L124,150 Q120,158 116,150 Z', cw.tie);
      g += sequins(120, 126, 10, 50, 27, 22);
      g += shade('M123,102 L127,100 L124,150 Q122,155 120,156 Q123,130 123,102 Z', 0.18);
      return g;
    }

    function glowArt(cw, uid) {
      if (!cw.glowArt) return '';
      const c = cw.glowArt;
      const fx = `filter="url(#${uid}-glow)"`;
      let g = '';
      g += stroke(
        'M120,118 Q98,140 104,166 Q112,190 120,196 Q128,190 136,166 Q142,140 120,118 Z',
        c,
        2.2,
        `${fx} opacity=".95"`
      );
      g += stroke(
        'M120,132 Q108,150 112,170 Q116,184 120,188 Q124,184 128,170 Q132,150 120,132 Z',
        c,
        1.6,
        `${fx} opacity=".8"`
      );
      g += stroke(
        'M94,112 Q104,128 102,146 M146,112 Q136,128 138,146',
        c,
        1.8,
        `${fx} opacity=".8"`
      );
      g += stroke('M104,206 Q120,214 136,206', c, 1.8, `${fx} opacity=".7"`);
      return g;
    }

    function velvetSheen() {
      return (
        light('M90,130 Q120,118 150,140 Q120,132 92,148 Z', 0.05) +
        light('M92,196 Q120,186 148,204 Q120,196 94,212 Z', 0.04)
      );
    }

    function fringeHip(cw) {
      if (!cw.fringe) return '';
      let g = '';
      for (let i = 0; i < 9; i++) {
        const x = 92 + i * 5.2,
          len = 34 + ((i * 13) % 19);
        g += stroke(
          `M${x},${256 + (i % 3) * 3} Q${x - 2},${266 + len / 2} ${x - 1},${256 + len + (i % 3) * 3}`,
          cw.fringe,
          2,
          `opacity=".92"`
        );
      }
      return g;
    }

    function satinSheen() {
      return (
        light('M92,124 Q124,110 152,138 Q124,128 94,142 Z', 0.1) +
        light('M90,176 Q122,162 150,190 Q122,180 92,196 Z', 0.06) +
        light('M96,116 Q95,180 98,244 L102,244 Q99,180 101,118 Z', 0.05)
      );
    }

    function collar(cw) {
      if (!cw.collar) return '';
      return (
        P('M106,92 L106,105 Q120,111 134,105 L134,92 Q120,99 106,92 Z', cw.collar) +
        shade('M106,92 L106,96 Q120,103 134,96 L134,92 Q120,99 106,92 Z', 0.25) +
        (cw.collarTrim ? stroke('M106,105 Q120,111 134,105', cw.collarTrim, 1.6) : '')
      );
    }

    function mockNeck(cw, uid) {
      if (!cw.mockNeck) return '';
      const fill = fillOf(cw.mockNeck, cw, uid);
      return (
        P('M106,86 L106,104 Q120,110 134,104 L134,86 Q120,93 106,86 Z', fill) +
        shade('M106,86 L106,90 Q120,97 134,90 L134,86 Q120,93 106,86 Z', 0.22) +
        stroke('M108,92 Q120,98 132,92 M108,97 Q120,103 132,97', '#000', 1, `opacity=".18"`)
      );
    }

    function cowlScarf(cw) {
      if (!cw.cowl) return '';
      const c = cw.cowl;
      let g = '';
      g += P('M98,96 Q120,84 142,96 Q145,104 142,112 Q120,124 98,112 Q95,104 98,96 Z', c);
      g += P(
        'M100,106 Q120,96 140,106 Q142,112 140,118 Q120,128 100,118 Q98,112 100,106 Z',
        lighten(c, 0.12)
      );
      g += shade('M100,98 Q120,88 140,98 Q120,104 100,98 Z', 0.22);
      g += P('M136,110 Q148,130 144,152 L133,148 Q137,128 132,114 Z', darken(c, 0.15));
      g += shade('M136,112 Q145,132 142,150 L139,149 Q141,130 134,114 Z', 0.15);
      return g;
    }

    function crewNeck(cw) {
      return stroke('M107,97 Q120,108 133,97', darken(cw.jacket, 0.25), 3);
    }

    function armSide(a, cw, uid) {
      if (a.type === 'none') return '';
      const bare = a.type === 'bare';
      const d = bare ? BARE_ARM_D : SLEEVE_D;
      const fill = bare ? cw.skin : fillOf(a.fill, cw, uid) || a.color || cw.jacket;
      let g = P(d, fill);
      g += shade('M79,150 Q78,200 81,242 L82,244 L76,243 Q74,200 75,152 Z', 0.13);
      g += light('M66,116 Q60,140 59,170 L62,170 Q63,140 69,118 Z', 0.08);
      if (a.detached) {
        // detached sleeve: bare shoulder, sleeve from above the elbow down
        g =
          P(BARE_ARM_D, cw.skin) +
          shade('M80,150 Q79,200 82,242 L82,244 L76,243 Q74,200 76,152 Z', 0.1) +
          P(
            'M64,132 Q58,166 60,200 Q61,228 64,244 L82,246 Q80,216 80,190 Q80,156 86,134 Q75,126 64,132 Z',
            fillOf(a.fill, cw, uid) || a.color
          ) +
          shade('M78,158 Q77,204 80,244 L82,246 L75,245 Q73,204 74,160 Z', 0.13) +
          light('M66,140 Q61,172 62,206 L65,206 Q64,172 69,142 Z', 0.1);
        g += stroke('M64,134 Q75,128 86,136', '#0d0d0f', 1.6, `opacity=".35"`);
      }
      if (a.type === 'half') {
        // rolled half-sleeve over a bare forearm
        g =
          P(BARE_ARM_D, cw.skin) +
          shade('M80,150 Q79,200 82,242 L82,244 L76,243 Q74,200 76,152 Z', 0.1) +
          P(
            'M78,103 Q66,111 62,134 Q60,152 60,168 L82,170 Q80,146 88,118 Q85,107 78,103 Z',
            fillOf(a.fill, cw, uid) || a.color
          ) +
          stroke('M60,166 L82,168', '#0d0d0f', 2.4, `opacity=".25"`) +
          light('M66,114 Q61,136 60,158 L63,158 Q64,136 69,116 Z', 0.09);
      }
      if (a.glowLine) {
        g += stroke(
          'M68,120 Q60,165 62,215',
          a.glowLine,
          2.2,
          `filter="url(#${uid}-glow)" opacity=".9"`
        );
      }
      if (a.patent) g += light('M64,130 Q59,168 61,210 L64,210 Q62,168 67,132 Z', 0.24);
      if (a.gauntlet) {
        const c = a.gauntlet.color;
        g += P('M61,212 L81,214 L84,248 Q70,255 56,247 Z', c);
        g += stroke('M61,214 L81,216', darken(c, 0.35), 2.2);
        g += shade('M76,215 L84,248 L78,251 L72,216 Z', 0.15);
        if (a.gauntlet.sequin) g += sequins(70, 232, 22, 30, 3, 16);
      }
      const handC = a.glove || cw.skin;
      g += P('M63,246 Q60,260 66,267 Q74,271 79,264 Q83,256 82,246 Q72,251 63,246 Z', handC);
      g += shade('M76,248 Q79,258 75,265 Q80,259 80,248 Z', 0.15);
      return g;
    }
    function arms(cw, uid) {
      return armSide(cw.armL, cw, uid) + mirror(armSide(cw.armR, cw, uid));
    }

    function epaulets(cw) {
      if (!cw.epaulet) return '';
      const c = cw.epaulet,
        m = cw.metal;
      const ep =
        P('M68,101 Q80,93 93,99 L91,111 Q79,105 71,111 Z', c) +
        stroke('M70,110 L69,120 M75,111 L74,121 M80,112 L79,122 M85,112 L84,121', c, 2) +
        `<circle cx="82" cy="101" r="2.6" fill="${m}"/><circle cx="81.2" cy="100.2" r="0.9" fill="#fff" opacity=".8"/>`;
      return ep + mirror(ep);
    }

    function belt(cw) {
      if (cw.waistBand) {
        // angled modern band with contrast edge
        let g = P('M84,240 L156,222 L158,238 L86,258 Z', cw.waistBand);
        g += stroke('M84,240 L156,222', cw.waistBandEdge || '#cfd4da', 2.2);
        g += shade('M84,246 L157,228 L158,238 L86,258 Z', 0.15);
        return g;
      }
      if (!cw.belt) return '';
      let g = P('M87,244 L153,244 L155,260 Q120,269 85,260 Z', cw.belt);
      g += shade('M87,244 L153,244 L153.5,249 L86.7,249 Z', 0.18);
      if (cw.buckle) {
        g +=
          `<rect x="112" y="247" width="16" height="13" fill="${cw.buckle}"/>` +
          `<rect x="115" y="250" width="10" height="7" fill="${darken(cw.buckle, 0.5)}"/>` +
          `<rect x="112" y="247" width="16" height="2.5" fill="#fff" opacity=".35"/>`;
      }
      return g;
    }

    function chest(cw) {
      const m = cw.metal;
      switch (cw.chest) {
        case 'braid': {
          let g = '';
          for (let i = 0; i < 5; i++) {
            const y = 126 + i * 17,
              half = 21 + i * 1.2;
            g += stroke(`M${120 - half},${y} Q120,${y + 4} ${120 + half},${y}`, cw.braid, 2.4);
            g +=
              `<circle cx="${120 - half}" cy="${y}" r="2.4" fill="${cw.braid}"/>` +
              `<circle cx="${120 + half}" cy="${y}" r="2.4" fill="${cw.braid}"/>` +
              `<circle cx="120" cy="${y + 3.4}" r="2.7" fill="${m}"/>` +
              `<circle cx="119.2" cy="${y + 2.6}" r="0.9" fill="#fff" opacity=".85"/>`;
          }
          return g;
        }
        case 'sash': {
          let g = P('M82,110 L102,102 L154,230 L136,242 Z', cw.sash);
          g += light('M88,110 L96,107 L146,232 L140,236 Z', 0.16);
          g += shade('M146,222 L154,230 L136,242 L131,232 Z', 0.18);
          g += stroke(
            'M138,242 L136,254 M143,239 L142,252 M148,236 L148,249 M152,232 L154,245',
            cw.sash,
            2
          );
          if (cw.sashSequin) g += sequins(118, 172, 26, 120, 11, 30);
          return g;
        }
        case 'baldric': {
          let g = P('M134,101 L158,109 L102,252 L82,242 Z', cw.baldric);
          g += light('M138,103 L146,106 L92,246 L86,243 Z', 0.1);
          if (cw.baldricSequin) g += sequins(120, 175, 30, 130, 5, 42);
          g += `<circle cx="144" cy="106" r="3.4" fill="${m}"/><circle cx="143" cy="105" r="1.1" fill="#fff" opacity=".8"/>`;
          return g;
        }
        case 'plastron': {
          let g = P('M100,103 Q120,96 140,103 L147,180 Q120,190 93,180 Z', cw.panel);
          g += stroke('M100,103 L93,180 M140,103 L147,180', cw.panelTrim, 2);
          for (let i = 0; i < 4; i++) {
            const y = 114 + i * 19;
            g += `<circle cx="${101 - i * 1.4}" cy="${y}" r="2.4" fill="${m}"/><circle cx="${139 + i * 1.4}" cy="${y}" r="2.4" fill="${m}"/>`;
          }
          return g;
        }
        case 'buttons': {
          let g = '';
          for (let i = 0; i < 5; i++) {
            const y = 122 + i * 24;
            g +=
              `<circle cx="108" cy="${y}" r="3" fill="${m}"/><circle cx="107" cy="${y - 1}" r="1" fill="#fff" opacity=".8"/>` +
              `<circle cx="132" cy="${y}" r="3" fill="${m}"/><circle cx="131" cy="${y - 1}" r="1" fill="#fff" opacity=".8"/>`;
          }
          return g;
        }
        case 'swash': {
          let g = P(
            'M148,98 Q118,148 98,198 Q90,226 90,256 L110,256 Q106,220 120,180 Q136,140 162,110 L158,100 Z',
            cw.swash
          );
          g += light('M150,102 Q126,140 112,180 L108,180 Q124,138 147,100 Z', 0.18);
          g += sequins(120, 180, 40, 140, 9, 40);
          return g;
        }
        case 'vinylPanel': {
          // glossy contrast chest panel (patent vinyl)
          let g = P('M96,103 Q120,95 144,103 L150,196 Q120,206 90,196 Z', cw.panel);
          g += stroke('M120,100 L120,200', '#c9ced6', 1.6);
          g += `<circle cx="120" cy="112" r="2.2" fill="#c9ced6"/>`;
          g += light('M101,108 Q99,150 101,192 L108,194 Q104,150 107,110 Z', 0.28);
          g += light('M134,106 Q137,148 136,190 L140,189 Q142,148 138,108 Z', 0.12);
          g += stroke('M96,103 L90,196 M144,103 L150,196', cw.panelTrim || '#0c0c0e', 2);
          return g;
        }
        default:
          return '';

    function swashLeg(cw) {
      if (cw.chest !== 'swash') return '';
      const c = cw.swash;
      let g = P('M89,256 Q86,320 93,436 L104,436 Q95,330 100,256 Z', c);
      g += sequins(96, 340, 12, 170, 7, 26);
      return g;
    }

    function neckerchief(cw) {
      if (!cw.scarf) return '';
      return (
        P('M104,96 Q120,104 136,96 L124,122 Q120,126 116,122 Z', cw.scarf) +
        shade('M116,120 Q120,125 124,120 L121,113 L119,113 Z', 0.25) +
        `<rect x="116.5" y="108" width="7" height="6" rx="1" fill="${darken(cw.scarf, 0.3)}"/>`
      );
    }

    // ---------- headwear ----------
    function shako(cw) {
      const h = cw.hat;
      if (!h) return '';
      const body = h.body,
        band = h.band,
        m = cw.metal;
      let g = '';
      g += P('M99,58 L95,8 Q120,2 145,8 L141,58 Q120,65 99,58 Z', body);
      g += shade('M132,6 Q140,7 145,8 L141,58 Q133,61 128,62 Q132,36 132,6 Z', 0.16);
      g += light('M99,10 Q102,10 106,9 Q104,34 104,58 Q100,57 99,56 Z', 0.09);
      g += P('M95,8 Q120,2 145,8 Q120,13 95,8 Z', lighten(body, 0.12));
      if (band) {
        g += P('M95.6,8 Q120,3 144.4,8 L143.9,16 Q120,11 96.1,16 Z', band);
        g += P('M99.4,52 Q120,59 140.6,52 L141,58 Q120,65 99,58 Z', band);
      }
      g += `<g>`;
      for (let a = 0; a < 8; a++) {
        const th = (a * Math.PI) / 4,
          x1 = 120 + Math.cos(th) * 6,
          y1 = 34 + Math.sin(th) * 6,
          x2 = 120 + Math.cos(th) * 11,
          y2 = 34 + Math.sin(th) * 11;
        g += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${m}" stroke-width="2.2"/>`;
      }
      g += `<circle cx="120" cy="34" r="6.5" fill="${m}"/><circle cx="120" cy="34" r="3.4" fill="${darken(m, 0.55)}"/><circle cx="118" cy="32" r="1.2" fill="#fff" opacity=".9"/></g>`;
      g += P('M98,56 Q120,80 142,56 L142,61 Q120,86 98,61 Z', '#0d0d0f');
      g += light('M100,58 Q120,78 140,58 Q120,74 100,58 Z', 0.12);
      return g;
    }

    function pith(cw) {
      const h = cw.hat;
      if (!h) return '';
      let g = '';
      g += P('M97,52 Q96,16 120,14 Q144,16 143,52 Z', h.body);
      g += shade('M130,17 Q141,24 142,50 L134,52 Q135,30 130,17 Z', 0.12);
      g += light('M102,24 Q99,36 99,50 L104,51 Q104,32 107,22 Z', 0.1);
      g += `<ellipse cx="120" cy="53" rx="31" ry="7.5" fill="${lighten(h.body, 0.06)}"/>`;
      g += shade('M89,53 A31,7.5 0 0 0 151,53 A31,7.5 0 0 1 89,53 Z', 0.18);
      if (h.band) g += P('M98,44 Q120,52 142,44 L142,51 Q120,58 98,51 Z', h.band);
      g += `<circle cx="120" cy="34" r="3.4" fill="${cw.metal}"/>`;
      return g;
    }

    function campaign(cw) {
      const h = cw.hat;
      if (!h) return '';
      let g = '';
      g += `<ellipse cx="120" cy="39" rx="36" ry="8.5" fill="${h.body}"/>`;
      g += shade('M120,39 m-36,0 a36,8.5 0 0 0 72,0 a36,8.5 0 0 1 -72,0 Z', 0.2);
      g += P('M101,38 Q101,10 120,8 Q139,10 139,38 Z', lighten(h.body, 0.05));
      g += stroke('M112,12 Q112,26 113,36 M128,12 Q128,26 127,36', darken(h.body, 0.25), 2);
      g += shade('M130,12 Q138,20 138,37 L132,38 Q133,22 130,12 Z', 0.12);
      if (h.band) g += P('M101,32 Q120,40 139,32 L139,38 Q120,46 101,38 Z', h.band);
      return g;
    }

    function plume(cw) {
      const p = cw.plume;
      if (!p) return '';
      if (p.type === 'upright') {
        let g = P(
          'M113,12 Q107,-34 118,-64 Q121,-70 124,-64 Q133,-32 127,12 Q120,16 113,12 Z',
          p.color
        );
        g += stroke('M117,8 Q114,-30 119,-58', lighten(p.color, 0.35), 1.1, `opacity=".7"`);
        g += stroke('M122,8 Q121,-34 121,-60', lighten(p.color, 0.35), 1.1, `opacity=".55"`);
        g += stroke('M125,6 Q127,-26 123,-56', darken(p.color, 0.25), 1.1, `opacity=".5"`);
        g += shade('M124,-60 Q130,-30 126,10 L121,12 Q128,-28 122,-62 Z', 0.12);
        if (p.mylar) g += sequins(120, -26, 12, 72, 13, 18);
        return g;
      }
      if (p.type === 'fountain') {
        let g = '';
        const arcs = [
          'M120,4 C114,-26 102,-26 94,-4',
          'M120,3 C116,-32 106,-34 100,-14',
          'M120,1 C118,-38 111,-40 108,-22',
          'M120,0 C120,-42 119,-42 117,-28',
          'M120,0 C121,-42 122,-42 124,-28',
          'M120,1 C123,-38 129,-40 133,-22',
          'M120,3 C125,-32 134,-34 141,-14',
          'M120,4 C127,-26 138,-26 147,-4',
          'M120,2 C117,-30 113,-32 112,-20',
          'M120,2 C123,-30 127,-32 128,-20',
        ];
        for (const a of arcs) {
          g += stroke(a, p.color, 3.8);
          g += stroke(a, lighten(p.color, 0.28), 1.2, `opacity=".45"`);
        }
        g += `<circle cx="120" cy="6" r="4.5" fill="${cw.metal}"/>`;
        return g;
      }
      return '';
    }

    // ---------- normalization: legacy symmetric fields -> per-side configs ----------
    function normalize(cw) {
      const c = { torsoStyle: 'jacket', ...cw };
      if (!c.armL) {
        const base = {
          type: 'sleeve',
          color: c.sleeve || c.jacket,
          gauntlet: c.gauntlet ? { color: c.gauntlet, sequin: c.gauntletSequin } : null,
          glove: c.glove || null,
        };
        c.armL = base;
        c.armR = c.armR || base;
      }
      if (!c.legL) {
        const base = { color: c.pants, stripe: c.stripe || null };
        c.legL = base;
        c.legR = c.legR || base;
      }
      return c;
    }

    // ---------- assembly ----------
    let UID = 0;
    function figureLayers(raw, uid) {
      const cw = normalize(raw);
      const flared = cw.legL.flare || cw.legR.flare;
      let L = '';
      L += defs(cw, uid);
      L += ground();
      if (flared) L += shoes(cw);
      L += legs(cw, uid);
      L += swashLeg(cw);
      L += streamers(cw);
      if (!flared) L += shoes(cw);
      L += torso(cw, uid);
      if (cw.satin) L += satinSheen();
      if (cw.velvet) L += velvetSheen();
      L += chest(cw);
      L += glowArt(cw, uid);
      L += suspenders(cw);
      L += belt(cw);
      L += tieDrop(cw);
      L += fringeHip(cw);
      L += arms(cw, uid);
      L += epaulets(cw);
      L += headNeck(cw);
      if (cw.hairShow) L += hair(cw);
      L += neckerchief(cw);
      L += collar(cw);
      L += mockNeck(cw, uid);
      L += cowlScarf(cw);
      if (cw.crew) L += crewNeck(cw);
      if (cw.plume) L += plume(cw);
      if (cw.hatType === 'shako') L += shako(cw);
      if (cw.hatType === 'pith') L += pith(cw);
      if (cw.hatType === 'campaign') L += campaign(cw);
      return L;
    }
    function renderFigure(cw, opts = {}) {
      const w = opts.w || 190;
      const uid = 'f' + ++UID;
      return `<svg viewBox="0 -84 240 560" width="${w}" role="img" aria-label="${opts.label || 'corps figure'}" xmlns="http://www.w3.org/2000/svg">${figureLayers(cw, uid)}</svg>`;
    }

    // ---------- anatomy callout diagram ----------
    function renderCallout(cw) {
      const L = [
        ['FRENCH UPRIGHT PLUME', 24, 56, 116, -38],
        ['HAT PLATE', 24, 130, 112, 34],
        ['STANDING COLLAR', 24, 200, 107, 99],
        ['BRAID ROWS', 24, 244, 99, 146],
        ['CUMMERBUND', 24, 352, 96, 252],
        ['LEG STRIPE', 24, 430, 90, 330],
        ['SPATS', 24, 544, 94, 444],
      ];
      const R = [
        ['SHAKO', 536, 126, 142, 32],
        ['EPAULET + FRINGE', 536, 202, 161, 106],
        ['TAILORED JACKET', 536, 268, 156, 172],
        ['GAUNTLET', 536, 330, 179, 232],
        ['GLOVE', 536, 362, 174, 260],
        ['BIBBERS', 536, 446, 146, 350],
      ];
      const OX = 160,
        OY = 96;
      const uid = 'f' + ++UID;
      let g = `<g transform="translate(${OX},${OY})">${figureLayers(cw, uid)}</g>`;
      const line = (x1, y1, x2, y2) =>
        `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#3d3d3d" stroke-width="1"/>`;
      const dot = (x, y) =>
        `<circle cx="${x}" cy="${y}" r="2.6" fill="none" stroke="#60a5fa" stroke-width="1.4"/>`;
      let ann = '';
      for (const [t, tx, ty, px, py] of L) {
        const ax = px + OX,
          ay = py + OY;
        ann +=
          line(tx + 2, ty + 5, 150, ty + 5) +
          line(150, ty + 5, ax - 6, ay) +
          dot(ax, ay) +
          `<text x="${tx}" y="${ty}" fill="#9a9a94" font-size="10.5" letter-spacing="1.6" font-family="JetBrains Mono, monospace">${t}</text>`;
      }
      for (const [t, tx, ty, px, py] of R) {
        const ax = px + OX,
          ay = py + OY;
        ann +=
          line(tx - 2, ty + 5, 428, ty + 5) +
          line(428, ty + 5, ax + 6, ay) +
          dot(ax, ay) +
          `<text x="${tx}" y="${ty}" fill="#9a9a94" font-size="10.5" letter-spacing="1.6" font-family="JetBrains Mono, monospace" text-anchor="end">${t}</text>`;
      }
      return `<svg viewBox="0 0 560 580" width="560" role="img" aria-label="Uniform component anatomy on the Classic Cadet colorway" xmlns="http://www.w3.org/2000/svg">${g}${ann}</svg>`;
    }
