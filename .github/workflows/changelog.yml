name: Changelog

# Fully automatic player-facing changelog (docs/FMA_LESSONS.md, lesson 2).
# When a PR merges into main, this decides whether the change is something a
# director would notice and, if so, writes a player-facing entry to
# src/data/changelogEntries.json (rendered by the /updates page) and commits it
# back to main. No human in the loop.
#
# Relevance + copy come from Gemini when GOOGLE_GENERATIVE_AI_API_KEY is set as
# a repository secret; without it the job falls back to a conservative
# conventional-commit heuristic, so it is safe to merge before the secret is
# added — it simply generates fewer entries.
#
# SETUP NOTE: this job pushes a commit to main. If main is a protected branch,
# allow the GitHub Actions bot to bypass the protection (or swap GITHUB_TOKEN
# for a PAT with push rights), otherwise the push is rejected and the changelog
# silently stops updating. The commit carries [skip ci] so it does not re-run
# the CI suite.

on:
  pull_request:
    types: [closed]
    branches: [main]

# Least privilege: the job only needs to read the PR and push one commit.
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  append-entry:
    name: Append changelog entry
    # Only merged PRs — a closed-without-merge PR changed nothing.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Guard the generator's own logic before trusting it to write to main.
      - name: Self-test the generator
        run: npm run changelog:selftest

      # The PR's changed files sharpen the noise filter (docs/test-only PRs), and
      # its commit messages carry the real description of the change — auto-merged
      # PRs land with a branch-slug title and empty body, so the commits are often
      # the only text that tells the generator what actually shipped.
      - name: Collect changed files and commits
        uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            core.exportVariable('PR_FILES', JSON.stringify(files.map((f) => f.filename)));

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const messages = commits.map((c) => c.commit.message).filter(Boolean);
            core.exportVariable('PR_COMMITS', JSON.stringify(messages));

      - name: Generate entry
        id: gen
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: node scripts/changelog/generateChangelogEntry.mjs

      - name: Commit entry
        if: steps.gen.outputs.changelog_created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/changelogEntries.json
          git commit -m "docs(changelog): ${{ steps.gen.outputs.changelog_title }} [skip ci]"
          git push origin main
